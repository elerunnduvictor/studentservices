<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — Student Services</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="login.css">
<!-- Apply saved theme before paint to avoid a flash -->
<script>
  (function () {
    var saved = localStorage.getItem("ss-theme");
    if (saved === "dark") document.documentElement.setAttribute("data-theme", "dark");
  })();
</script>
</head>
<body>

<!-- Blurred recreation of the home hero -->
<div class="login-bg" aria-hidden="true">
  <div class="login-bg-orbs"></div>
  <div class="login-bg-grid"></div>
</div>
<div class="login-scrim" aria-hidden="true"></div>

<button class="login-theme-btn" id="themeToggle" title="Toggle theme" aria-label="Toggle theme">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
</button>

<main class="login-card">
  <div class="badge">BYU-Pathway Worldwide</div>
  <h1>Student <span>Services</span></h1>
  <p class="login-subtitle">Authorized Access Only</p>

  <form id="loginForm" novalidate>
    <label class="sr-only" for="emailInput">Email address</label>
    <input type="email" id="emailInput" autocomplete="email" placeholder="Enter your email address" required />
    <button type="submit">
      Sign In
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
  </form>

  <div class="error-msg" id="errorMsg" role="alert" aria-live="polite">Access denied. Your email is not provisioned.</div>
</main>

<script src="../js/allowed-users.js"></script>
<script src="../js/login.js"></script>
<script src="../js/shared.js"></script>

</body>
</html>
