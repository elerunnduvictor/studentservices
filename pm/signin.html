<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<!-- Theme is decided before the first paint, not after.

     Without this the browser lays out a white page, then shell.js runs and
     switches it to dark — a full-brightness flash on every load. Setting
     color-scheme as well as the attribute matters: it tells the browser what to
     paint the canvas *before* any stylesheet has arrived, which is the part the
     class alone cannot cover.

     Must stay ahead of the stylesheet links below, and must match initTheme()
     in shell.js exactly, including the system-preference fallback. -->
<script>
  (function () {
    try {
      var saved = localStorage.getItem("ss-theme");
      var dark = saved === "dark" ||
                 (!saved && window.matchMedia("(prefers-color-scheme: dark)").matches);
      if (dark) document.documentElement.setAttribute("data-theme", "dark");
      document.documentElement.style.colorScheme = dark ? "dark" : "light";
    } catch (e) { /* private mode: fall through to light */ }
  })();
</script>
<title>Sign In — Student Services PM Hub</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body class="signin">

<main class="signin-card">
  <div class="badge">BYU-Pathway Worldwide</div>
  <h1>PM <em>Hub</em></h1>
  <p class="lede">Authorized Editors Only</p>

  <form id="signinForm" novalidate>
    <div class="field">
      <label class="sr-only" for="emailInput">Email address</label>
      <input type="email" id="emailInput" autocomplete="email"
             placeholder="Your @churchofjesuschrist.org address" required>
    </div>
    <div class="field">
      <label class="sr-only" for="passwordInput">Password</label>
      <input type="password" id="passwordInput" autocomplete="current-password"
             placeholder="Password" required>
    </div>
    <!-- Only shown while creating a password, so a typo cannot lock someone out
         of an account there is no way to recover from the browser. -->
    <div class="field" id="confirmField" hidden>
      <label class="sr-only" for="confirmInput">Confirm password</label>
      <input type="password" id="confirmInput" autocomplete="new-password"
             placeholder="Confirm password">
    </div>
    <button class="btn btn-primary" type="submit" id="submitBtn">
      <span id="btnLabel">Sign In</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
  </form>

  <div class="signin-msg" id="msg" hidden></div>

  <p class="signin-switch">
    <a href="#" id="modeToggle">First time here? Set your password</a>
  </p>

  <p class="signin-foot">
    Editing rights are limited to the departmental project managers.<br>
    Contact Ben Packer and Jess Swinburne for Provisioning Access.
  </p>
</main>

<script src="../shared/js/config.js"></script>
<script src="../shared/js/data-service.js"></script>
<script src="js/shell.js"></script>
<script>
  (function () {
    const SS = window.SS;
    SS.shell.initTheme();

    /* Sent back by the idle guard rather than by choosing to sign out. Saying
       so matters: landing on a login screen with no explanation reads as the
       app having lost your session for no reason. */
    if (new URLSearchParams(location.search).get("expired")) {
      const note = document.getElementById("msg");
      if (note) {
        note.textContent =
          "You were signed out after an hour without activity. Sign in to continue.";
        note.className = "signin-msg";
        note.hidden = false;
      }
    }

    /* Already signed in? Straight into the workbooks. */
    /* Where to land after signing in.
       An allowlist, not a sanitiser: `next` arrives in the query string and
       anything that is not plainly one of this app's own pages is discarded
       rather than repaired, so it can never become an off-site redirect. The
       `.html` is optional because cleanUrls serves these pages without it. */
    function safeNext(v) {
      return /^[a-z-]+(\.html)?$/.test(v || "") ? v : "okrs.html";
    }

    const session = SS.shell.readSession();
    if (session) {
      const next = new URLSearchParams(location.search).get("next");
      location.replace(safeNext(next));
      return;
    }

    const form     = document.getElementById("signinForm");
    const input    = document.getElementById("emailInput");
    const pwInput  = document.getElementById("passwordInput");
    const confirmField = document.getElementById("confirmField");
    const confirmInput = document.getElementById("confirmInput");
    const btn      = document.getElementById("submitBtn");
    const btnLabel = document.getElementById("btnLabel");
    const toggle   = document.getElementById("modeToggle");
    const msg      = document.getElementById("msg");

    const MIN_PASSWORD = 8;
    let creating = false;   // false = signing in, true = setting a password

    function show(text, kind) {
      msg.hidden = false;
      msg.className = "signin-msg " + kind;
      msg.textContent = text;
    }

    function setMode(create) {
      creating = create;
      confirmField.hidden = !create;
      confirmInput.required = create;
      pwInput.setAttribute("autocomplete", create ? "new-password" : "current-password");
      pwInput.placeholder = create ? "Choose a password" : "Password";
      btnLabel.textContent = create ? "Create Password" : "Sign In";
      toggle.textContent = create
        ? "Already set a password? Sign in"
        : "First time here? Set your password";
      msg.hidden = true;
    }

    toggle.addEventListener("click", (e) => { e.preventDefault(); setMode(!creating); });

    if (!window.SS_CONFIG.isConfigured) {
      form.hidden = true;
      show("The PM Hub isn't connected to the database yet. See docs/SETUP.md — " +
           "the Supabase URL and anon key go in shared/js/config.js.", "err");
      return;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = input.value.trim().toLowerCase();
      const password = pwInput.value;

      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        return show("Please enter a valid email address.", "err");
      }

      /* There used to be a check here against a shipped list of the seven
         provisioned addresses, so an unprovisioned person was told before the
         round trip rather than after it. The list was a public file — seven
         work email addresses served to anyone who asked for the path — and it
         was never the boundary; the comment here said as much.

         The server gives the same answer and better wording. The signup
         trigger refuses an unprovisioned address with "This address is not
         provisioned for Student Services. Contact Ben Packer or Jess
         Swinburne.", and the catch below shows exactly that. One round trip,
         no published list. */

      if (creating) {
        if (password.length < MIN_PASSWORD) {
          return show(`Please choose a password of at least ${MIN_PASSWORD} characters.`, "err");
        }
        /* Checked here rather than after the round trip: there is no password
           reset in the PM Hub, so a mistyped new password would lock the
           account with nothing the browser could do about it. */
        if (password !== confirmInput.value) {
          return show("The two passwords do not match.", "err");
        }
      } else if (!password) {
        return show("Please enter your password.", "err");
      }

      btn.disabled = true;
      btnLabel.textContent = creating ? "Creating…" : "Signing in…";
      try {
        if (creating) await SS.shell.createAccount(email, password);
        else          await SS.shell.signIn(email, password);
        const next = new URLSearchParams(location.search).get("next");
        location.replace(safeNext(next));
      } catch (err) {
        show(err.message, "err");
        btn.disabled = false;
        btnLabel.textContent = creating ? "Create Password" : "Sign In";
      }
    });
  })();
</script>

</body>
</html>
